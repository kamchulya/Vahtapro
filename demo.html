<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>ВахтаПро — демо табелей, KPI и приёма</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --dark: #0d1117;
    --acc: #00b87a;
    --acc2: #007a52;
    --txt: #1a2030;
    --mut: #6b7280;
    --bord: #e2ddd5;
    --surf: #ffffff;
    --bad: #ff3d57;
    --warn: #ff8c42;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Golos Text', sans-serif;
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
  }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    background: var(--bg);
    border-bottom: 1px solid var(--bord);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 700; color: var(--acc); }
  .logo span { color: var(--txt); }
  .tabs {
    display: flex; gap: 2px; background: var(--surf); padding: 4px; border-radius: 10px; border: 1px solid var(--bord);
    overflow-x: auto;
  }
  .tab {
    padding: 7px 13px; border-radius: 7px; border: none; background: transparent; color: var(--mut);
    font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .tab.active { background: var(--acc); color: #000; font-weight: 700; }
  .screen { display: none; padding: 32px; max-width: 1020px; margin: 0 auto; }
  .screen.on { display: block; }
  .sh { font-family: 'Unbounded', sans-serif; font-size: 20px; margin-bottom: 5px; }
  .sd { color: var(--mut); font-size: 13px; margin-bottom: 20px; }
  
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surf); border: 1px solid var(--bord); border-radius: 12px; padding: 16px; text-align: center; }
  .stat-n { font-family: 'Unbounded', sans-serif; font-size: 28px; font-weight: 700; color: var(--acc); }
  .stat-l { font-size: 11px; color: var(--mut); }
  
  .tbl { background: var(--surf); border: 1px solid var(--bord); border-radius: 12px; overflow-x: auto; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th { text-align: left; padding: 10px 12px; font-size: 10px; font-weight: 700; color: var(--mut); background: rgba(0,0,0,.02); }
  td { padding: 10px 12px; font-size: 12px; border-top: 1px solid var(--bord); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
  .d-ok { background: var(--acc); }
  .d-w { background: var(--warn); }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  .badge-w { background: rgba(255,140,66,.15); color: var(--warn); }
  .badge-ok { background: rgba(0,184,122,.12); color: var(--acc2); }
  
  .phone { max-width: 380px; margin: 0 auto; background: var(--surf); border: 1px solid var(--bord); border-radius: 20px; padding: 20px; }
  .fl { margin-bottom: 12px; }
  .fl-lb { font-size: 10px; color: var(--mut); margin-bottom: 4px; text-transform: uppercase; }
  .fl-in { width: 100%; background: var(--bg); border: 1px solid var(--bord); border-radius: 6px; padding: 8px 11px; font-size: 13px; }
  .sal { background: rgba(0,184,122,.07); border-radius: 10px; padding: 12px; text-align: center; margin: 14px 0; }
